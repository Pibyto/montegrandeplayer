      z-index: 3;

    .wave-bar:nth-child(4n) { animation-delay: 0.6s; }
    .wave-bar:nth-child(5n) { animation-delay: 0.8s; }

      100% { height: 50px; opacity: 1; }

    function bindLongClick(element, channelObj) {
      var pressTimer;
      var isLongPress = false;
      var keyStartTime = 0;
      element.addEventListener('touchstart', function(e) {
        isLongPress = false;
        clearTimeout(pressTimer);
        pressTimer = setTimeout(function() {
          isLongPress = true;
          toggleFavorito(channelObj);
        }, 1200);
      }, {passive: true});
      element.addEventListener('touchend', function(e) { clearTimeout(pressTimer); }, {passive: true});
      element.addEventListener('touchmove', function(e) { clearTimeout(pressTimer); }, {passive: true});
      element.addEventListener('keydown', function(e) {
        if (e.key === "Enter" || e.keyCode === 13) {
          if (!keyStartTime) {
            keyStartTime = Date.now();
            isLongPress = false;
            clearTimeout(pressTimer);
            pressTimer = setTimeout(function() {
              isLongPress = true;
              toggleFavorito(channelObj);
            }, 1200);
          }
        }
      });
      element.addEventListener('keyup', function(e) {
        if (e.key === "Enter" || e.keyCode === 13) {
          clearTimeout(pressTimer);
          var duration = Date.now() - keyStartTime;
          keyStartTime = 0;
          if (isLongPress || duration >= 1200) {
            e.preventDefault();
            e.stopPropagation();
            isLongPress = false;
          }
        }
      });
    }

    function ejecutarCargaUrl(url) {
      mostrarLogo(url);
      window.currentStreamingUrl = url;
      
      destroyPlayers(); 

      var urlDecodificada = decodeURIComponent(url);
      var ext = urlDecodificada.split('?')[0].split('.').pop().toLowerCase();
      
      var isMpegTs = (ext === 'ts' || url.indexOf(':25461/') !== -1);
      var cachedChannel = window.channelCache[url] || window.channelCache[urlDecodificada];
      
      var esContenidoAudio = false;
      if (cachedChannel) {
        var nombreLower = cachedChannel.name.toLowerCase();
        var groupLower = cachedChannel.group.toLowerCase();
        if (ext === 'mp3' || groupLower.includes('radio') || groupLower.includes('mp3') || nombreLower.includes('radio') || nombreLower.includes('mp3')) { 
          esContenidoAudio = true; 
        }
      }
      
      if (esContenidoAudio) {
        window.audioBackgroundImg.src = (cachedChannel && cachedChannel.logo && cachedChannel.logo.trim() !== "" && cachedChannel.logo.indexOf('127.0.0.1') === -1 && cachedChannel.logo.indexOf('placehold.co') === -1) ? cachedChannel.logo : "https://tinyurl.com/Maximagenn";
        window.audioVisualLayer.style.display = 'flex';
        video.src = url; 
        video.play().catch(function() { video.load(); video.play(); });
      } else {
        window.audioVisualLayer.style.display = 'none';
        video.style.display = 'block';

        if (isMpegTs && window.mpegts && mpegts.isSupported()) { 
          try { 
            window.currentMpegts = mpegts.createPlayer({ type: 'mpegts', url: url, isLive: true }, { enableStashBuffer: true, liveBufferLatencyChasing: false, stashInitialSize: 128 }); 
            window.currentMpegts.attachMediaElement(video); 
            window.currentMpegts.load(); 
            window.currentMpegts.play().catch(function(){}); 
          } catch(e) { video.src = url; video.play().catch(function(){}); } 
        } else if (window.Hls && Hls.isSupported()) { 
          window.currentHls = new Hls({ enableWorker: true, lowLatencyMode: false, manifestLoadingTimeOut: 5000, levelLoadingTimeOut: 5000 }); 
          window.currentHls.attachMedia(video); 
          window.currentHls.loadSource(url); 
          window.currentHls.on(Hls.Events.MANIFEST_PARSED, function() { video.play().catch(function(){}); }); 
          window.currentHls.on(Hls.Events.ERROR, function (event, data) { if (data.fatal) { destroyPlayers(); video.src = url; video.play().catch(function(){}); } }); 
        } else { 
          video.src = url; 
          video.play().catch(function() { video.load(); video.play().catch(function(){}); }); 
        }
      }
      ocultarInterfazDespuesDeJugar(); 
    }

    function fetchM3UGroups(url, isTv, callback) { 
      try { 
        var xhr = new XMLHttpRequest(); xhr.open("GET", url, true); xhr.onreadystatechange = function () { 
          if (xhr.readyState === 4) { 
            var groups = {}; 
            if (xhr.status === 200) { 
              var lines = xhr.responseText.split("\n"); var name = "", group = "General", logo = ""; 
              for (var i = 0; i < lines.length; i++) { 
                var line = lines[i].trim(); 
                if (line.indexOf("#EXTINF") === 0) { 
                  var n = line.match(/,([^,]+)$/); name = n ? n[1] : "Sin título"; 
                  var g = line.match(/group-title="([^"]*)"/); group = g ? g[1] : "General"; 
                  var l = line.match(/tvg-logo="([^"]*)"/); logo = l ? l[1] : ""; 
                } else if (line.indexOf("http") === 0) { 
                  if (name) { 
                    var channelObj = { name: name, url: line, logo: (logo && logo !== "http://127.0.0.1/") ? logo : null, group: group };
                    if (!groups[group]) groups[group] = []; 
                    groups[group].push(channelObj); 
                    if (isTv) { window.channelCache[line] = channelObj; }
                  } name = ""; 
                } 
              } 
            } callback(groups); 
          } 
        }; xhr.send(); 
      } catch(e) { callback({}); } 
    }

      var isBackKey = (
        e.key === 'Escape' || e.key === 'Back' || e.key === 'GoBack' || e.key === 'BrowserBack' || 
        e.key === 'Backspace' || keyCode === 27 || keyCode === 8 || keyCode === 461 || keyCode === 10009 || keyCode === 4
      );

      if (isBackKey) {
        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();
        manejarBotonAtras();
        return false;
      }

      if (window.isUiHidden) { 
        if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === 'Enter') {
          e.preventDefault(); showUi(); focusFirstAvailable(); return; 
        }
      } 
      resetUiTimeout(); 

      var active = document.activeElement; 
      if (!active) return; 

      var inSideMenu = active.classList.contains('menu-icon'); 
      var menuItems = Array.prototype.slice.call(window.sideMenu.querySelectorAll('.menu-icon')); 
      var rows = Array.prototype.slice.call(window.contentArea.querySelectorAll('.scroll-row')); 
      
      var currentCtxItems = [], currentRowIdx = -1, currentItemIdx = -1; 
      if (!inSideMenu) { 
        rows.forEach(function(row, rIdx) { 
          var items = Array.prototype.slice.call(row.querySelectorAll('[tabindex="0"]')); 
          var iIdx = items.indexOf(active); 
          if (iIdx !== -1) { currentRowIdx = rIdx; currentItemIdx = iIdx; currentCtxItems = items; } 
        }); 
      } 

      switch (e.key) { 
        case 'ArrowLeft': 
          if (!inSideMenu) { 
            e.preventDefault();
            if (currentItemIdx > 0) { 
              currentCtxItems[currentItemIdx - 1].focus(); 
              ensureScrollVisible(rows[currentRowIdx], currentCtxItems[currentItemIdx - 1]); 
            } else { 
              focusSelectedMenuIcon(); 
            } 
          } 
          break; 
          
        case 'ArrowRight': 
          if (inSideMenu) { 
            e.preventDefault(); 
            focusFirstAvailable(); 
          } else if (currentItemIdx < currentCtxItems.length - 1) { 
            e.preventDefault(); 
            currentCtxItems[currentItemIdx + 1].focus(); 
            ensureScrollVisible(rows[currentRowIdx], currentCtxItems[currentItemIdx + 1]); 
          } 
          break; 
          
        case 'ArrowUp': 
          if (inSideMenu) { 
            e.preventDefault(); 
            var mIdx = menuItems.indexOf(active); 
            if (mIdx > 0) menuItems[mIdx - 1].focus(); 
          } else if (currentRowIdx > 0) { 
            e.preventDefault();
            var targetRowItems = Array.prototype.slice.call(rows[currentRowIdx - 1].querySelectorAll('[tabindex="0"]')); 
            var targetIdx = Math.min(currentItemIdx, targetRowItems.length - 1); 
            if (targetRowItems[targetIdx]) { 
              targetRowItems[targetIdx].focus(); 
              ensureVerticalScrollVisible(targetRowItems[targetIdx]); 
              ensureScrollVisible(rows[currentRowIdx - 1], targetRowItems[targetIdx]); 
            } 
          } 
          break; 
          
        case 'ArrowDown': 
          if (inSideMenu) { 
            e.preventDefault(); 
            var mIdx = menuItems.indexOf(active); 
            if (mIdx < menuItems.length - 1) menuItems[mIdx + 1].focus(); 
          } else if (currentRowIdx < rows.length - 1) { 
            e.preventDefault();
            var targetRowItems = Array.prototype.slice.call(rows[currentRowIdx + 1].querySelectorAll('[tabindex="0"]')); 
            var targetIdx = Math.min(currentItemIdx, targetRowItems.length - 1); 
            if (targetRowItems[targetIdx]) { 
              targetRowItems[targetIdx].focus(); 
              ensureVerticalScrollVisible(targetRowItems[targetIdx]); 
              ensureScrollVisible(rows[currentRowIdx + 1], targetRowItems[targetIdx]); 
            } 
          } 
          break; 

        case 'Enter': 
          if (!active.hasAttribute('data-url') || window.currentMode !== 'home') { 
            e.preventDefault(); 
            active.click(); 
          }
          break; 
      } 
    }

    function ensureScrollVisible(row, element) { 
      var rowBounds = row.getBoundingClientRect(); var elBounds = element.getBoundingClientRect(); 
      if (elBounds.right > rowBounds.right) row.scrollLeft += (elBounds.right - rowBounds.right) + 40; 
      else if (elBounds.left < rowBounds.left) row.scrollLeft -= (rowBounds.left - elBounds.left) + 40; 
    }

    function ensureVerticalScrollVisible(element) {
      var containerBounds = window.contentArea.getBoundingClientRect(); var elBounds = element.getBoundingClientRect();
      if (elBounds.bottom > containerBounds.bottom) { window.contentArea.scrollTop += (elBounds.bottom - containerBounds.bottom) + 30; }
      else if (elBounds.top < containerBounds.top) { window.contentArea.scrollTop -= (containerBounds.top - elBounds.top) + 30; }
    }

    video.addEventListener('click', function() { if (window.isUiHidden) { showUi(); focusFirstAvailable(); } else hideUi(); }); 
    window.audioVisualLayer.addEventListener('click', function() { if (window.isUiHidden) { showUi(); focusFirstAvailable(); } else hideUi(); });
    
    window.addEventListener('keydown', handleKeydown, true); 
    window.addEventListener('keyup', function(e) {
      var keyCode = e.keyCode || e.which;
      if (e.key === 'Escape' || e.key === 'Back' || keyCode === 27 || keyCode === 8 || keyCode === 4) {
        e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
      }
    }, true);

    document.addEventListener('click', presionoBotonMando);
    
    function init() { 
      var icons = window.sideMenu.querySelectorAll('.menu-icon'); 
      for (var i = 0; i < icons.length; i++) {
        icons[i].addEventListener('click', function() { 
          var type = this.getAttribute('data-type'); window.contentArea.innerHTML = '';
          if (type === 'home') { renderHome(); } 
          else if (type === 'movies') { window.lastPlayedTvUrl = ""; renderMoviesOrKids(window.moviesGroups, "movies"); } 
          else if (type === 'series') { window.lastPlayedTvUrl = ""; renderSeries(window.seriesGroups); } 
          else if (type === 'kids') { window.lastPlayedTvUrl = ""; renderMoviesOrKids(window.kidsGroups, "kids"); } 
          else if (type === 'favorites') { window.lastPlayedTvUrl = ""; renderFavorites(); }
        }); 
      }
      iniciarCicloDonaciones();
      renderHome(); 
    }
    loadAllData(init);
  });
</script>
</body>
</html>
